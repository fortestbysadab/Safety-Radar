<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Safety Radar</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading fallback shown before JS loads on mobile -->
    <div id="boot-splash">
      <div class="spinner"></div>
      <p>Safety Radar</p>
    </div>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0b1220; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e5e7eb; overflow: hidden; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0b1220; z-index: 9999;
      }
      #boot-splash p { color:#ef4444; font-weight: 600; letter-spacing: 0.5px; margin-top: 16px; }
      .spinner {
        width: 42px; height: 42px; border: 3px solid rgba(239,68,68,.25); border-top-color:#ef4444;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
